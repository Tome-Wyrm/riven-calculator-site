<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riven Calculator</title>
  <meta name="description" content="Warframe riven stat ranges by weapon class and shape, a goal calculator and a riven grader.">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Riven Calculator</h1>
    <p class="tagline">Stat ranges by weapon class and shape, and the odds of hitting a target roll.</p>
  </header>

  <main>
    <details id="ranges" class="panel" open>
      <summary><h2 id="ranges-title">Stat ranges</h2></summary>
      <div id="ranges-body"></div>
    </details>

    <details id="calculator" class="panel" open>
      <summary><h2 id="calculator-title">Goal calculator</h2></summary>
      <div id="calculator-body"></div>
    </details>

    <details id="grader" class="panel" open>
      <summary><h2 id="grader-title">Riven grader</h2></summary>
      <div id="ocr-body" class="ocr"></div>
      <div id="grader-body"></div>
      <div id="import-body" class="import"></div>
    </details>
  </main>

  <footer class="site-footer">
    <p>Values from the riven formula on the Warframe wiki; weapon list from WFCD warframe-items (updated <span id="weapons-updated">—</span>). Not affiliated with Digital Extremes.</p>
  </footer>
</body>
</html>
